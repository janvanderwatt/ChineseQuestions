<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Q&A</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Chinese Q&A</h1>
      <p class="subtitle">Q1 only for now. Debug on right until API response stable.</p>
    </header>

    <div class="app-shell">
      <main class="main-column">
        <div class="form-group">
          <h2>What does this character mean?</h2>
          <label for="q1-char">Character</label>
          <input type="text" id="q1-char" placeholder="e.g., 很" maxlength="5" value="高">
          <label for="q1-sentence">Sentence context</label>
          <textarea id="q1-sentence" placeholder="e.g., 我的朋友很高">我的朋友很高</textarea>
          <button id="q1-submit">Submit</button>
        </div>

        <div id="response" class="response"></div>

        <div class="config-section">
          <h3>Configuration</h3>
          <label for="api-key">OpenRouter API Key</label>
          <input type="password" id="api-key" placeholder="sk-or-...">
          <button id="save-config">Save Config</button>
          <p>Key stored in browser local storage. Get one at <a href="https://openrouter.ai" target="_blank" rel="noreferrer">openrouter.ai</a></p>
        </div>
      </main>

      <aside class="debug-column">
        <div class="debug-panel">
          <h3>Debug</h3>
          <div class="debug-block">
            <strong>Status</strong>
            <pre id="debug-status">Idle</pre>
          </div>
          <div class="debug-block">
            <strong>Prompt</strong>
            <pre id="debug-prompt">Waiting for submit...</pre>
          </div>
          <div class="debug-block">
            <strong>Raw API</strong>
            <pre id="debug-raw">No response yet.</pre>
          </div>
          <div class="debug-block">
            <strong>Parsed</strong>
            <pre id="debug-parsed">No parsed content yet.</pre>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="src/api.js"></script>
  <script src="config.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
